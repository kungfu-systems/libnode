name: Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev/v*.x
      - dev/v*/v*.*
      - alpha/v*/v*.*

permissions:
  actions: read
  contents: read
  issues: write
  id-token: write

concurrency:
  group: libnode-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-matrix:
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@v4-alpha
    with:
      runner-preset: custom
      platforms-json: >-
        [{"id":"linux-x64","name":"Linux x64","platform":"linux","runner":"[\"self-hosted\",\"Linux\",\"X64\",\"kungfu-build-v4-linux-x64\"]","capabilities":["node","native-toolchain","product-artifacts"]},{"id":"linux-arm64","name":"Linux ARM64","platform":"linux","runner":"[\"ubuntu-24.04-arm\"]","capabilities":["node","native-toolchain","product-artifacts"]},{"id":"macos-arm64","name":"macOS ARM64","platform":"macos","runner":"[\"self-hosted\",\"macOS\",\"ARM64\",\"kungfu-build-v4-macos-arm64\"]","capabilities":["node","native-toolchain","product-artifacts"]},{"id":"windows-x64","name":"Windows x64","platform":"windows","runner":"[\"self-hosted\",\"Windows\",\"X64\",\"kungfu-build-v4-windows-x64\"]","capabilities":["node","native-toolchain","product-artifacts"]}]
      buildchain-alpha-contract-lock-path: .buildchain/alpha-contract-lock.json
      buildchain-stable-contract-lock-path: .buildchain/contract-lock.json
      buildchain-contract-drift-issue-mode: compatible-and-breaking
      artifact-transfer-mode: s3-to-github-artifacts
      checkout-cache-mode: auto
      checkout-cache-mirror-url-template: ${{ vars.BUILDCHAIN_CHECKOUT_CACHE_MIRROR_URL_TEMPLATE }}
      checkout-cache-fallback: github
      checkout-cache-timeout-seconds: 60
      setup-node: true
      node-version: '24'
      install-command: node .gyp/buildchain-install.js "${{ vars.KF_NODE_GIT_URL }}" "${{ vars.KF_NODE_REFERENCE }}"
      require-install: true
      require-build: true
      require-verify: true
      artifact-name: libnode
      artifact-name-template: '{artifact}-{platform}-{sha}'
      artifact-paths: |
        build/stage
      release-candidate: ${{ startsWith(github.base_ref, 'alpha/') }}
      publish-channel: ${{ startsWith(github.base_ref, 'alpha/') && 'alpha' || 'none' }}
      expected-artifacts-json: >-
        {"minFiles":1,"minTotalBytes":10000000}
      artifact-retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    needs: build-matrix
    if: always()
    steps:
      - name: Require build matrix success
        run: |
          if [ "${{ needs.build-matrix.result }}" != "success" ]; then
            echo "::error::build matrix result was ${{ needs.build-matrix.result }}"
            exit 1
          fi
      - name: Checkout the qualified package source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
      - name: Download the complete native package set
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: libnode-*
          path: .buildchain/package-set
      - name: Verify the five-package collaboration interface
        run: node .gyp/libnode-kfd3-artifact-verify.js .buildchain/package-set > .buildchain/kfd-3/collaboration-interface.artifact.json
      - name: Require the resolved KFD verifier runtime
        env:
          BUILDCHAIN_KFD_RUNTIME_SHA: ${{ needs.build-matrix.outputs.buildchain-runtime-sha }}
        run: '[[ "$BUILDCHAIN_KFD_RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout the same Buildchain runtime for KFD gates
        uses: actions/checkout@v7.0.0
        with:
          repository: kungfu-systems/buildchain
          ref: ${{ needs.build-matrix.outputs.buildchain-runtime-sha }}
          path: .buildchain/gate-runtime
          persist-credentials: false
      - name: Install the declared KFD verifier dependencies
        working-directory: .buildchain/gate-runtime
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify KFD gate failure boundaries
        env:
          BUILDCHAIN_KFD_RUNTIME_ROOT: ${{ github.workspace }}/.buildchain/gate-runtime
          BUILDCHAIN_KFD_RUNTIME_SHA: ${{ needs.build-matrix.outputs.buildchain-runtime-sha }}
        run: node --test .gyp/libnode-kfd-gates.test.js
      - name: Require KFD-1 and KFD-3 release gates
        env:
          BUILDCHAIN_KFD_RUNTIME_SHA: ${{ needs.build-matrix.outputs.buildchain-runtime-sha }}
        run: node .gyp/libnode-kfd-gates.js .buildchain/gate-runtime "$BUILDCHAIN_KFD_RUNTIME_SHA" .buildchain/kfd-3/collaboration-interface.artifact.json > .buildchain/kfd-3/release-gates.json
      - name: Retain package set verification
        uses: actions/upload-artifact@v7.0.1
        with:
          name: libnode-kfd3-package-set-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .buildchain/kfd-1/libnode-contract-world.witness.json
            .buildchain/kfd-2/public-release-trust.claim.json
            .buildchain/kfd-3/collaboration-interface.prebuild.json
            .buildchain/kfd-3/collaboration-interface.artifact.json
            .buildchain/kfd-3/release-gates.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
