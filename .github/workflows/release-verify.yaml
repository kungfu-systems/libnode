name: Release - Verify

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - release/v*.x
      - release/v*/v*.*

permissions:
  actions: read
  contents: read
  issues: write
  id-token: write

concurrency:
  group: libnode-release-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@v3
    with:
      runner-preset: custom
      platforms-json: >-
        [{"id":"linux-x64","name":"Linux x64","platform":"linux","runner":"[\"self-hosted\",\"Linux\",\"X64\",\"kungfu-build-v4-linux-x64\"]","capabilities":["node","native-toolchain","product-artifacts"]},{"id":"linux-arm64","name":"Linux ARM64","platform":"linux","runner":"[\"ubuntu-24.04-arm\"]","capabilities":["node","native-toolchain","product-artifacts"]},{"id":"macos-arm64","name":"macOS ARM64","platform":"macos","runner":"[\"self-hosted\",\"macOS\",\"ARM64\",\"kungfu-build-v4-macos-arm64\"]","capabilities":["node","native-toolchain","product-artifacts"]},{"id":"windows-x64","name":"Windows x64","platform":"windows","runner":"[\"self-hosted\",\"Windows\",\"X64\",\"kungfu-build-v4-windows-x64\"]","capabilities":["node","native-toolchain","product-artifacts"]}]
      buildchain-alpha-contract-lock-path: buildchain.alpha-contract-lock.json
      buildchain-stable-contract-lock-path: buildchain.contract-lock.json
      buildchain-contract-drift-issue-mode: compatible-and-breaking
      artifact-transfer-mode: s3-to-github-artifacts
      checkout-cache-mode: auto
      checkout-cache-mirror-url-template: ${{ vars.BUILDCHAIN_CHECKOUT_CACHE_MIRROR_URL_TEMPLATE }}
      checkout-cache-fallback: github
      checkout-cache-timeout-seconds: 60
      setup-node: true
      node-version: '24'
      install-command: node .gyp/buildchain-install.js "${{ vars.KF_NODE_GIT_URL }}" "${{ vars.KF_NODE_REFERENCE }}"
      require-install: true
      require-build: true
      require-verify: true
      artifact-name: libnode
      artifact-name-template: '{artifact}-{platform}-{sha}'
      artifact-paths: |
        build/stage
      release-candidate: true
      publish-channel: release
      expected-artifacts-json: >-
        {"minFiles":1,"minTotalBytes":10000000}
      artifact-retention-days: 14
