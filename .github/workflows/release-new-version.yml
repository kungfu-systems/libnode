name: Release - New Version

on:
  push:
    branches:
      - alpha/v*/v*.*
      - release/v*/v*.*
  workflow_dispatch:

permissions:
  actions: write
  artifact-metadata: write
  attestations: write
  checks: write
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: libnode-release-new-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    uses: kungfu-systems/buildchain/.github/workflows/release-candidate-promote.yml@v4-alpha
    secrets: inherit
    with:
      package-manager: pnpm
      buildchain-channel: auto
      buildchain-alpha-contract-lock-path: .buildchain/alpha-contract-lock.json
      buildchain-stable-contract-lock-path: .buildchain/contract-lock.json
      buildchain-contract-drift-issue-mode: compatible-and-breaking
      artifact-name: libnode
      release-candidate-workflow-file: ${{ startsWith(github.ref_name, 'release/') && 'release-verify.yaml' || 'build.yml' }}
      release-candidate-workflow-name: ${{ startsWith(github.ref_name, 'release/') && 'Release - Verify' || 'Build' }}
      artifact-patterns: |
        libnode-macos-arm64-*
        libnode-linux-x64-*
        libnode-linux-arm64-*
        libnode-windows-x64-*
      required-status-check: build
      required-artifact-count: 4
      publish-dist-tag: ${{ startsWith(github.ref_name, 'alpha/') && 'alpha' || 'latest' }}
      publish-package-set-order: platforms-first-main-last
      publish-package-main: '@kungfu-tech/libnode'
      publication-auto-admission: true
      publication-auto-no-gate: true
      publication-publisher-workflow-path: .github/workflows/release-new-version.yml
      publication-product: Libnode
      publication-target: npm:@kungfu-tech/libnode
      publication-package-name: '@kungfu-tech/libnode'
      release-passport-product-name: Libnode
      github-release: true
